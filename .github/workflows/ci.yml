name: Windows verification

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && 'Release package verification' || 'Repository safety and Windows tests' }}
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      VERIFY_RELEASE: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect committed files
        shell: powershell
        run: ./scripts/Test-RepositorySafety.ps1 -Worktree -History
      - name: Scan Git history with Gitleaks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          $scannerDirectory = Join-Path $env:GITHUB_WORKSPACE '.tools/gitleaks'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          $expected = 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) { throw 'Gitleaks archive checksum mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $scannerDirectory
          & (Join-Path $scannerDirectory 'gitleaks.exe') git --no-banner --redact --log-opts='--all' .
          if ($LASTEXITCODE -ne 0) { throw 'History secret scan failed.' }
      - name: Run application and interface tests
        if: env.VERIFY_RELEASE != 'true'
        shell: powershell
        run: ./NumaControl/tests/Run-Tests.ps1
      - name: Verify and summarize visual coverage
        if: env.VERIFY_RELEASE != 'true'
        shell: powershell
        run: ./scripts/Test-VisualResults.ps1 -Path ./NumaControl/tests/artifacts/latest-results.json
      - name: Get pinned WiX tools
        if: env.VERIFY_RELEASE == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $archive
          $expected = '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) { throw 'WiX archive checksum mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath ./NumaControl/.tools/wix-3.14.1
      - name: Build and verify release distributions
        id: release_bundle
        if: env.VERIFY_RELEASE == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $assembly = Get-Content -LiteralPath ./NumaControl/src/AssemblyInfo.cs -Raw
          if ($assembly -notmatch 'AssemblyFileVersion\("(\d+\.\d+\.\d+)\.0"\)') { throw 'Missing release version.' }
          $version = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'The tag does not match the application version.' }
            git merge-base --is-ancestor HEAD refs/remotes/origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Release tags must point to a commit in main.' }
          }
          ./scripts/New-ReleaseBundle.ps1 -Version $version -WithInstaller -SmokeTest
          "directory=output/releases/v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Keep verified distributions for release review
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-distributions
          path: ${{ steps.release_bundle.outputs.directory }}
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Prepare verified release draft
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-distributions
          path: dist
      - name: Verify downloaded files and create a draft
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${TAG#v}"
          portable="NUMA-Control-$version-portable-x64.zip"
          msi="NUMA-Control-$version-setup-x64.msi"
          setup="NUMA-Control-$version-setup-x64.exe"
          diff <(printf '%s\n' "$portable" "$msi" "$setup" SHA256SUMS.txt SOURCE.txt | sort) <(ls -A | sort)
          tr -d '\r' < SHA256SUMS.txt | sed -nE 's/^[0-9a-f]{64} \*(.*)$/\1/p' | sort | diff <(printf '%s\n' "$portable" "$msi" "$setup" | sort) -
          tr -d '\r' < SHA256SUMS.txt | sha256sum --strict --check -
          commit="$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)"
          tr -d '\r' < SOURCE.txt | grep -Fx "Version: $version"
          tr -d '\r' < SOURCE.txt | grep -Fx "Source commit: $commit"
          existing_tags="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name')"
          if grep -Fxq "$TAG" <<< "$existing_tags"; then
            echo "A release already exists for $TAG. Review its draft or published assets before retrying."
            exit 1
          fi

          release_section() {
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GH_REPO/contents/$1?ref=$commit" |
              tr -d '\r' |
              awk -v version="$version" '
                /^##([[:blank:]]|$)/ {
                  ++sections
                  if (sections == 1) {
                    heading = $2
                    sub(/^\[/, "", heading)
                    sub(/\].*$/, "", heading)
                    matches = heading == version
                  }
                  next
                }
                sections == 1 && matches {
                  if (/^- /) ++bullets
                  print
                }
                END { if (!matches || !bullets) exit 1 }
              '
          }
          release_section CHANGELOG.md > "$RUNNER_TEMP/release-en.md" ||
            { echo "The English changelog needs a top section for $TAG."; exit 1; }
          release_section CHANGELOG.ru.md > "$RUNNER_TEMP/release-ru.md" ||
            { echo "The Russian changelog needs a top section for $TAG."; exit 1; }
          source="https://github.com/$GH_REPO/blob/$commit"
          {
            printf '## English\n'
            cat "$RUNNER_TEMP/release-en.md"
            printf '\nUse `%s` for the recommended setup. Compare the downloaded file with `SHA256SUMS.txt`.\n' "$setup"
            printf '\n[User guide](%s/NumaControl/USER-GUIDE.md) · [Changelog](%s/CHANGELOG.md)\n\n' "$source" "$source"
            printf '## Русский\n'
            cat "$RUNNER_TEMP/release-ru.md"
            printf '\nДля обычной установки скачайте `%s`. Сверьте хеш файла с `SHA256SUMS.txt`.\n' "$setup"
            printf '\n[Руководство пользователя](%s/NumaControl/USER-GUIDE.ru.md) · [История изменений](%s/CHANGELOG.ru.md)\n' "$source" "$source"
          } > "$RUNNER_TEMP/release-notes.md"
          if (( $(wc -c < "$RUNNER_TEMP/release-notes.md") > 32768 )); then
            echo "Release notes exceed the 32 KiB draft limit. Shorten the two current changelog sections."
            exit 1
          fi
          gh release create "$TAG" "$portable" "$msi" "$setup" SHA256SUMS.txt SOURCE.txt \
            --verify-tag --draft --title "NUMA Control $version" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
